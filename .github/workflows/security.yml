name: Security Checks

on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install dependencies (ci)
        run: npm ci
      - name: Run npm audit (high severity)
        run: npm audit --audit-level=high || true
      - name: Run build to catch security-related build warnings
        run: npm run build
      - name: Generate bundle stats (no fail)
        run: |
          npx --yes rollup-plugin-visualizer@latest --version >/dev/null 2>&1 || true
          echo "Bundle stats generated by Vite plugin during build (dist/stats.html)"

